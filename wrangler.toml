name = "mcp-relay"
main = "src/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace for OAuth state (tokens, clients, codes)
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "e78c23710e5e4623813036dcbc5b251a"

# Set to "true" once all devices run a plugin version that registers a device
# secret; until then, legacy devices without a secret can still poll.
[vars]
REQUIRE_DEVICE_SECRET = "false"

# Durable Objects binding
[[durable_objects.bindings]]
name = "MCP_RELAY"
class_name = "MCPRelay"

[[durable_objects.bindings]]
name = "PAIRING_INDEX"
class_name = "PairingIndex"

# Migrations for Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MCPRelay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PairingIndex"]

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Optional: Custom domain (uncomment and configure)
# [[routes]]
# pattern = "mcp.koreader.dev/*"
# custom_domain = true

# Workers Logs: the relay logs one JSON line per device registration.
# Per-request invocation logs are off, since devices long-poll constantly.
[observability]
[observability.logs]
enabled = true
invocation_logs = false
